name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3000/api

  backend:
    name: Backend (smoke test con PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: control_stock
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: control_stock
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-secret
      ADMIN_EMAIL: admin@test.com
      ADMIN_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Iniciar API
        run: |
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Smoke test de autenticación
        run: |
          set -e
          # Login correcto devuelve token
          TOKEN=$(curl -sf -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@test.com","password":"admin123"}' | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != "null"

          # Login con contraseña incorrecta: 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@test.com","password":"incorrecta"}')
          test "$code" = "401"

          # Ruta protegida sin token: 401; con token: 200
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/productos)
          test "$code" = "401"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/productos \
            -H "Authorization: Bearer $TOKEN")
          test "$code" = "200"

          echo "Smoke test OK"

      - name: Log del servidor
        if: always()
        run: cat server.log || true
